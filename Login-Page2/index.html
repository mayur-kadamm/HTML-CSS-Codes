<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web-Log.com</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <!-- This is main container  -->
  <div class="container">

    <!-- here stated our form -->
     <form action="#">

      <!-- this is for header logo -->
       <div class="header-part">
          <img src="/CSS-Project/Images/Web-Icon/user-solid-full.svg" alt="">
       </div>

       <!-- here start our search box  -->
       <div class="input-box">
          <i class='bx bxs-user-pin'></i>
          <input type="text" placeholder="Enter Username" required>
       </div>

       <!-- here password box -->
       <div class="input-box">
          <i class='bx bxs-lock-open-alt' ></i>
          <input type="password" placeholder="Enter Password" required>
       </div>

       <!-- here we take our page remember and forgot part -->
       <div class="remember-forgot">
            <label for="#"><input type="checkbox">Remember Me</label>
            <a href="#">
              Forgot Password
            </a>
       </div>

       <!-- here our page login button -->
       <button type="submit">Login</button>

       <!-- here registration link -->
       <div class="reg-ling">
            <p>Don' hava an account? <a href="#">Register</a>
            </p>
       </div>
       
     </form>

  </div>
</body>
</html>
